<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="canvas-area"></div>
        <div class="sidebar">
            <button class="btn next-btn">
                <img src="https://res.cloudinary.com/w24obzi2/image/upload/v1792656561/%E6%97%A0%E5%9B%BE%E5%83%8F.webp" alt="eye">
            </button>
            <div class="text-next">NEXT</div>

            <div class="point-wrap">
                <div class="point-text">Point</div>
                <div class="point-num">0000</div>
            </div>

            <button class="btn sound-btn">
                <img id="soundIcon" src="https://res.cloudinary.com/w24obzi2/image/upload/v1792656560/%E9%9D%99%E9%9F%B3.webp" alt="sound">
            </button>

            <button class="btn restart-btn">
                <img src="https://res.cloudinary.com/w24obzi2/image/upload/v1792656560/%E5%88%B7%E6%96%B0.webp" alt="restart">
            </button>
        </div>
    </div>

    <!-- 音频元素，隐藏不显示播放器，替换src为你的音频文件 -->
    <audio id="gameAudio" src="bgm.mp3" loop>

    <script src="script.js"></script>
</body>
</html>
