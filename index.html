<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="canvas-area"></div>
        <div class="sidebar">
            <button class="btn next-btn">
                <img src="https://res.cloudinary.com/w24obzi2/image/upload/v1792656561/无图像.webp


" alt="eye">
            </button>
            <div class="text-next">NEXT</div>

            <div class="point-text">Point</div>
            <div class="point-num">0000</div>

            <button class="btn sound-btn">
                <img id="soundIcon" src="https://res.cloudinary.com/w24obzi2/image/upload/v1792656560/刷新.webp


" alt="sound">
            </button>

            <button class="btn restart-btn">
                <img src="https://res.cloudinary.com/w24obzi2/image/upload/v1792656560/静音.webp


" alt="restart">
            </button>
        </div>
    </div>
    <script src="https://res.cloudinary.com/w24obzi2/image/upload/v1792656561/无图像.webp
"></script>
</body>
</html>
